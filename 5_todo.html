<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子ども用 5時間Todoリスト</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kosugi Maru', sans-serif;
            background-color: #f0fdfa;
            background-image: radial-gradient(#ccfbf1 2px, transparent 2px);
            background-size: 20px 20px;
        }
        .bounce-active:active {
            transform: scale(0.95);
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .task-card {
            transition: all 0.2s ease;
        }
        .task-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* 花丸アニメーション用スタイル */
        @keyframes hanamaruPop {
            0% { transform: scale(0) rotate(-30deg); opacity: 0; }
            60% { transform: scale(1.15) rotate(8deg); opacity: 1; }
            85% { transform: scale(0.95) rotate(-3deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .hanamaru-bounce {
            animation: hanamaruPop 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes strokeDraw {
            from { stroke-dashoffset: 1000; }
            to { stroke-dashoffset: 0; }
        }
        .draw-stroke {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: strokeDraw 1.2s ease-in-out forwards;
        }
    </style>
</head>
<body class="text-slate-800 pb-20">

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center gap-2">
            <div class="flex items-center gap-2 md:gap-3 flex-1 min-w-0">
                <div class="bg-teal-100 text-teal-800 px-2.5 py-1 rounded-full text-xs md:text-sm font-bold shadow-sm whitespace-nowrap shrink-0" id="display-grade">
                    1ねんせい
                </div>
                <button onclick="showNameSelector()" class="text-lg md:text-2xl font-black text-slate-700 bg-transparent border-b-2 border-dashed border-teal-300 hover:border-teal-500 focus:outline-none transition-colors flex items-center gap-1.5 truncate" id="current-student-name">
                    なまえをえらぶ <i class="fa-solid fa-caret-down text-sm"></i>
                </button>
                <!-- 花丸＆レベルボタン（タップでスタンプ帳を開く） -->
                <button onclick="openStampModal()" class="bg-rose-50 hover:bg-rose-100 border-2 border-rose-300 text-rose-600 px-2.5 py-1 rounded-full text-xs md:text-sm font-black flex items-center gap-1 shrink-0 shadow-sm transition-all bounce-active" id="header-stamp-badge" title="スタンプちょうをみる">
                    <span>💮</span>
                    <span id="header-stamp-count">0こ</span>
                    <span class="bg-rose-500 text-white px-1.5 py-0.5 rounded-full text-[10px] font-bold" id="header-level-badge">Lv.1</span>
                </button>
            </div>
            <button onclick="openEditModal()" class="w-10 h-10 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center hover:bg-slate-200 transition-colors shadow-sm shrink-0" title="へんしゅう">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-6" id="app-container">
        <!-- JSでここにコンテンツが生成されます -->
    </main>

    <!-- 全部完了時の花丸ドカン演出用オーバーレイ (タップで即閉じられるように改善) -->
    <div id="hanamaru-overlay" onclick="hideHanamaruOverlay()" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm hidden transition-opacity duration-300 cursor-pointer">
        <div class="relative flex flex-col items-center justify-center p-6 text-center">
            <div id="hanamaru-graphic" class="relative">
                <svg class="w-72 h-72 md:w-96 md:h-96 text-red-500 filter drop-shadow-[0_10px_15px_rgba(239,68,68,0.4)] hanamaru-bounce" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path class="draw-stroke" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M100,20 C115,18 128,10 138,22 C148,34 165,30 168,48 C171,66 188,75 182,92 C176,109 186,126 172,138 C158,150 158,168 140,172 C122,176 112,192 95,185 C78,178 60,188 48,174 C36,160 16,152 18,134 C20,116 5,102 12,85 C19,68 12,48 28,38 C44,28 58,36 72,22 Z" />
                    <circle class="draw-stroke" style="animation-delay: 0.2s;" cx="100" cy="100" r="54" stroke="currentColor" stroke-width="7" stroke-linecap="round" />
                    <circle class="draw-stroke" style="animation-delay: 0.4s;" cx="100" cy="100" r="34" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
                </svg>
            </div>
            <div id="hanamaru-text" class="text-3xl md:text-5xl font-black text-red-500 bg-white/95 px-8 py-3 rounded-full shadow-2xl border-4 border-red-500 mt-4 animate-bounce tracking-widest">
                たいへんよくできました💮
            </div>
            <div class="text-white text-xs mt-4 font-bold bg-black/40 px-3 py-1 rounded-full">
                画面をタップすると閉じます
            </div>
        </div>
    </div>

    <!-- 共有フッターバー -->
    <div class="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-sm border-t border-slate-200 p-3 z-50">
        <div class="max-w-3xl mx-auto flex justify-center gap-4">
            <button onclick="shareClassroom()" class="bg-green-600 text-white px-6 py-3 rounded-full font-bold shadow-lg hover:bg-green-700 transition-all flex items-center gap-2 bounce-active">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/59/Google_Classroom_Logo.png" alt="Classroom" class="w-5 h-5">
                Classroomでくばる
            </button>
            <button onclick="copyShareUrl()" class="bg-slate-700 text-white px-6 py-3 rounded-full font-bold shadow-lg hover:bg-slate-800 transition-all flex items-center gap-2 bounce-active">
                <i class="fa-solid fa-link"></i>
                URLをコピー
            </button>
        </div>
    </div>

    <!-- 名前選択モーダル -->
    <div id="name-selector-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md flex flex-col overflow-hidden fade-in text-center p-4 sm:p-8">
            <h1 class="text-lg sm:text-2xl md:text-3xl font-black text-slate-800 mb-6 whitespace-nowrap tracking-tight">きみの なまえを えらんでね！</h1>
            <div id="student-buttons-container" class="grid grid-cols-1 gap-3 max-h-[60vh] overflow-y-auto p-2">
                <!-- JSでボタンが生成されます -->
            </div>
            <div class="mt-6 pt-4 border-t border-slate-100">
                <button onclick="openEditModal()" class="text-sm font-bold text-slate-400 hover:text-slate-600 flex items-center justify-center gap-2 mx-auto">
                    <i class="fa-solid fa-gear"></i> せんせい・おうちのひと用へんしゅう
                </button>
            </div>
        </div>
    </div>

    <!-- 花丸スタンプ帳モーダル -->
    <div id="stamp-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm hidden z-[80] flex items-center justify-center p-4">
        <div class="bg-amber-50 rounded-3xl shadow-2xl w-full max-w-lg border-4 border-amber-300 overflow-hidden fade-in flex flex-col max-h-[90vh]">
            <div class="p-4 bg-amber-400 text-amber-950 flex justify-between items-center shadow-md">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">💮</span>
                    <h2 class="text-xl font-black"><span id="stamp-modal-student-name"></span> の はなまるスタンプちょう</h2>
                </div>
                <button onclick="closeStampModal()" class="w-8 h-8 bg-amber-200 text-amber-900 rounded-full flex items-center justify-center hover:bg-amber-100 font-bold">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="p-6 overflow-y-auto space-y-6 flex-1">
                <!-- レベルステータスカード -->
                <div class="bg-white rounded-2xl p-4 shadow border-2 border-amber-200 text-center relative overflow-hidden">
                    <div class="text-sm font-bold text-amber-700 mb-1">いまの しょうごう</div>
                    <div class="text-2xl font-black text-amber-900 flex items-center justify-center gap-2" id="stamp-level-title">
                        Lv.1 ひよこきゅう 🐣
                    </div>
                    <!-- プログレスバー -->
                    <div class="mt-3 bg-amber-100 rounded-full h-4 w-full overflow-hidden p-0.5 border border-amber-300">
                        <div id="stamp-level-bar" class="bg-gradient-to-r from-amber-400 to-rose-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                    <div class="text-xs font-bold text-slate-500 mt-1" id="stamp-next-info">つぎのレベルまで あと 3こ💮</div>
                </div>

                <!-- スタンプ台紙 (20マス) -->
                <div>
                    <div class="text-xs font-bold text-slate-500 mb-2 flex justify-between items-center">
                        <span>あつめた はなまる</span>
                        <span class="font-black text-rose-500 text-sm" id="stamp-total-text">0 / 20こ</span>
                    </div>
                    <div class="grid grid-cols-5 gap-2.5 bg-amber-100/70 p-4 rounded-2xl border-2 border-dashed border-amber-300" id="stamp-grid">
                        <!-- JSでスタンプマスが生成されます -->
                    </div>
                </div>
            </div>
            
            <div class="p-4 bg-white border-t border-amber-200 text-center">
                <button onclick="closeStampModal()" class="bg-amber-500 hover:bg-amber-600 text-white font-black px-8 py-2.5 rounded-full shadow bounce-active">
                    とじる
                </button>
            </div>
        </div>
    </div>

    <!-- 編集モーダル -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-[70] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-4xl max-h-[95vh] flex flex-col overflow-hidden fade-in">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50">
                <h2 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-pen-to-square text-teal-600 mr-2"></i>先生・おうちのひと用 へんしゅう画面</h2>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-200">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <div class="flex flex-1 overflow-hidden flex-col md:flex-row">
                <!-- 生徒リストサイドバー -->
                <div class="w-full md:w-1/3 bg-slate-100 border-r border-slate-200 overflow-y-auto p-4 flex flex-col gap-2" id="edit-student-list">
                    <!-- JSで生徒リストが生成されます -->
                </div>
                
                <!-- タスク編集エリア -->
                <div class="w-full md:w-2/3 p-4 overflow-y-auto flex-1 bg-slate-50/50" id="edit-form-container">
                    <!-- JSで編集フォームが生成されます -->
                </div>
            </div>

            <div class="p-4 border-t bg-white flex justify-between items-center gap-3">
                <div class="flex items-center gap-2">
                    <span class="text-sm font-bold text-slate-600">学年(対象):</span>
                    <select id="edit-grade" class="border rounded-lg p-1.5 font-bold text-slate-700 outline-none focus:ring-2 focus:ring-teal-500 text-sm">
                    </select>
                </div>
                <div class="flex gap-2">
                    <button onclick="closeEditModal()" class="px-5 py-2.5 rounded-xl font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors text-sm md:text-base">キャンセル</button>
                    <button onclick="saveChanges()" class="px-5 py-2.5 rounded-xl font-bold text-white bg-teal-500 hover:bg-teal-600 shadow transition-colors flex items-center gap-2 text-sm md:text-base">
                        <i class="fa-solid fa-check"></i> ほぞん
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 教科の定義
        const SUBJECTS = {
            'こくご': { icon: '📖', color: 'bg-red-100 text-red-700 border-red-200' },
            'さんすう': { icon: '🔢', color: 'bg-blue-100 text-blue-700 border-blue-200' },
            'しょしゃ': { icon: '🖌️', color: 'bg-purple-100 text-purple-700 border-purple-200' },
            'せいかつ': { icon: '🌱', color: 'bg-green-100 text-green-700 border-green-200' },
            'ずこう': { icon: '🎨', color: 'bg-yellow-100 text-yellow-700 border-yellow-200' },
            'おんがく': { icon: '🎵', color: 'bg-pink-100 text-pink-700 border-pink-200' },
            'たいいく': { icon: '🏃', color: 'bg-orange-100 text-orange-700 border-orange-200' },
            'どうとく': { icon: '💖', color: 'bg-rose-100 text-rose-700 border-rose-200' },
            'がっかつ': { icon: '🏫', color: 'bg-indigo-100 text-indigo-700 border-indigo-200' },
            'じりつ': { icon: '🌟', color: 'bg-cyan-100 text-cyan-700 border-cyan-200' },
            'じゆう': { icon: '🎮', color: 'bg-slate-100 text-slate-700 border-slate-200' }
        };

        const GRADES = ['1ねんせい', '2ねんせい', '3ねんせい', '4ねんせい', '5ねんせい', '6ねんせい', 'とくべつしえん'];

        // レベルとしょうごうの定義（1年生に合わせてひらがな化）
        const LEVEL_TITLES = [
            { req: 0, level: 1, name: 'ひよこきゅう 🐣', next: 3 },
            { req: 3, level: 2, name: 'うさぎきゅう 🐰', next: 5 },
            { req: 5, level: 3, name: 'らいおんきゅう 🦁', next: 10 },
            { req: 10, level: 4, name: 'どらごんきゅう 🐉', next: 20 },
            { req: 20, level: 5, name: 'はなまるますたー 👑', next: 999 }
        ];

        function getLevelInfo(count) {
            count = count || 0;
            let current = LEVEL_TITLES[0];
            for (let i = 0; i < LEVEL_TITLES.length; i++) {
                if (count >= LEVEL_TITLES[i].req) {
                    current = LEVEL_TITLES[i];
                }
            }
            return current;
        }

        // デフォルトの時間割ひな形（1年生用）
        const defaultHours1st = [
            { time: '1じかんめ', subject: 'こくご', tasks: [{ text: 'ひらがなの れんしゅう', completed: false }, { text: 'おんどく', completed: false }] },
            { time: '2じかんめ', subject: 'さんすう', tasks: [{ text: 'たしざん ぷりんと', completed: false }] },
            { time: '3じかんめ', subject: 'たいいく', tasks: [{ text: 'なわとび 10かい', completed: false }, { text: 'たいそう', completed: false }] },
            { time: '4じかんめ', subject: 'ずこう', tasks: [{ text: 'えを かく', completed: false }] },
            { time: '5じかんめ', subject: 'がっかつ', tasks: [{ text: 'あしたの じゅんび', completed: false }] }
        ];

        // デフォルトの時間割ひな形（2年生用）
        const defaultHours2nd = [
            { time: '1じかんめ', subject: 'こくご', tasks: [{ text: 'かん字の れんしゅう', completed: false }, { text: 'おんどく ２かい', completed: false }] },
            { time: '2じかんめ', subject: 'さんすう', tasks: [{ text: 'ひっさん プリント', completed: false }] },
            { time: '3じかんめ', subject: 'しょしゃ', tasks: [{ text: 'ていねいに かく', completed: false }] },
            { time: '4じかんめ', subject: 'おんがく', tasks: [{ text: 'けんばん ハーモニカ', completed: false }] },
            { time: '5じかんめ', subject: 'がっかつ', tasks: [{ text: 'あしたの じゅんび', completed: false }] }
        ];

        const defaultData = {
            students: [
                { id: 'student-1', name: 'おざき　あやと', grade: '1ねんせい', hanamaruCount: 0, hours: JSON.parse(JSON.stringify(defaultHours1st)) },
                { id: 'student-2', name: 'かわぎし　きりと', grade: '1ねんせい', hanamaruCount: 0, hours: JSON.parse(JSON.stringify(defaultHours1st)) },
                { id: 'student-3', name: 'にわ　りく', grade: '2ねんせい', hanamaruCount: 0, hours: JSON.parse(JSON.stringify(defaultHours2nd)) },
                { id: 'student-4', name: '村口　眞太朗', grade: '2ねんせい', hanamaruCount: 0, hours: JSON.parse(JSON.stringify(defaultHours2nd)) }
            ]
        };

        let appData = JSON.parse(JSON.stringify(defaultData));
        let currentStudentId = null;
        let editingStudentId = null;

        // 音声・効果音処理
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                if (type === 'check') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'clear') {
                    osc.type = 'triangle';
                    const now = audioCtx.currentTime;
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.15);
                    osc.frequency.setValueAtTime(783.99, now + 0.3);
                    osc.frequency.setValueAtTime(1046.50, now + 0.45);
                    gainNode.gain.setValueAtTime(0.3, now);
                    gainNode.gain.linearRampToValueAtTime(0.3, now + 0.6);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 1.2);
                    osc.start(now);
                    osc.stop(now + 1.2);
                }
            } catch(e) {
                console.log('Audio play ignored:', e);
            }
        }

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const sharedDataStr = urlParams.get('data');
            
            if (sharedDataStr) {
                try {
                    const decoded = decodeURIComponent(escape(atob(sharedDataStr)));
                    appData = JSON.parse(decoded);
                    window.history.replaceState({}, document.title, window.location.pathname);
                    saveDataToLocal();
                    
                    Swal.fire({
                        title: 'あたらしい やることリスト！',
                        text: 'きょうも がんばろう！',
                        icon: 'success',
                        confirmButtonText: 'オーケー！',
                        confirmButtonColor: '#14b8a6'
                    }).then(() => checkAndShowNameSelector());
                } catch (e) {
                    console.error("データの読み込みに失敗しました", e);
                    loadLocalData();
                    checkAndShowNameSelector();
                }
            } else {
                loadLocalData();
                checkAndShowNameSelector();
            }

            checkDateAndResetTasks();
        }

        // 日付変更の自動チェック＆タスクリセット
        function checkDateAndResetTasks() {
            const today = new Date().toISOString().slice(0, 10);
            const lastDate = localStorage.getItem('kidsTodo_lastActiveDate');
            
            if (lastDate && lastDate !== today) {
                // 日付が変わったら完了チェックをクリア
                resetAllTasksCompletion();
            }
            localStorage.setItem('kidsTodo_lastActiveDate', today);
        }

        function resetAllTasksCompletion() {
            if (appData && appData.students) {
                appData.students.forEach(student => {
                    student.hours.forEach(hour => {
                        hour.tasks.forEach(task => {
                            task.completed = false;
                        });
                    });
                });
                saveDataToLocal();
            }
        }

        function loadLocalData() {
            const saved = localStorage.getItem('kidsTodoAppData_v10');
            if (saved) {
                appData = JSON.parse(saved);
            } else {
                appData = JSON.parse(JSON.stringify(defaultData));
                saveDataToLocal();
            }
            
            const savedStudentId = localStorage.getItem('kidsTodoCurrentStudentId');
            if (savedStudentId && appData.students.some(s => s.id === savedStudentId)) {
                currentStudentId = savedStudentId;
            } else {
                currentStudentId = null;
            }
        }

        function saveDataToLocal() {
            localStorage.setItem('kidsTodoAppData_v10', JSON.stringify(appData));
            if (currentStudentId) {
                localStorage.setItem('kidsTodoCurrentStudentId', currentStudentId);
            }
        }

        function checkAndShowNameSelector() {
            if (!currentStudentId || !appData.students.some(s => s.id === currentStudentId)) {
                showNameSelector();
            } else {
                document.getElementById('name-selector-modal').classList.add('hidden');
                renderApp();
            }
        }

        function showNameSelector() {
            const container = document.getElementById('student-buttons-container');
            let html = '';
            
            if (!appData.students || appData.students.length === 0) {
                html = `<p class="text-slate-500 mb-4 font-bold">まだ なまえが ありません。<br>せんせいに きいてね。</p>`;
            } else {
                appData.students.forEach(student => {
                    const gradeStr = student.grade || '1ねんせい';
                    const stamps = student.hanamaruCount || 0;
                    
                    html += `
                        <button onclick="selectStudent('${student.id}')" class="bg-teal-50 hover:bg-teal-100 border-4 border-teal-200 text-teal-800 text-lg md:text-xl font-black p-3.5 rounded-3xl shadow-sm transition-all bounce-active flex items-center justify-between gap-2">
                            <div class="flex items-center gap-2 min-w-0">
                                <i class="fa-solid fa-face-smile text-teal-500 text-2xl shrink-0"></i>
                                <span class="truncate">${escapeHtml(student.name)}</span>
                            </div>
                            <div class="flex items-center gap-1.5 shrink-0">
                                <span class="text-xs bg-rose-100 text-rose-700 border border-rose-200 px-2 py-0.5 rounded-full font-bold">💮${stamps}こ</span>
                                <span class="text-xs bg-teal-200 text-teal-800 px-2 py-0.5 rounded-full font-bold">${escapeHtml(gradeStr)}</span>
                            </div>
                        </button>
                    `;
                });
            }
            container.innerHTML = html;
            document.getElementById('name-selector-modal').classList.remove('hidden');
        }

        function selectStudent(studentId) {
            currentStudentId = studentId;
            saveDataToLocal();
            document.getElementById('name-selector-modal').classList.add('hidden');
            renderApp();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, function(match) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[match];
            });
        }

        function getSubjectBadgeHtml(subjectName) {
            if (!subjectName || !SUBJECTS[subjectName]) return '';
            const sub = SUBJECTS[subjectName];
            return `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-bold border ${sub.color}">
                ${sub.icon} ${subjectName}
            </span>`;
        }

        function getSubjectSelectHtml(currentSubject, id) {
            let options = `<option value="">--きめない--</option>`;
            for (const [name, info] of Object.entries(SUBJECTS)) {
                const selected = currentSubject === name ? 'selected' : '';
                options += `<option value="${name}" ${selected}>${info.icon} ${name}</option>`;
            }
            return `
                <select id="${id}" class="text-sm border rounded p-1 bg-white focus:ring-2 focus:ring-teal-500 outline-none">
                    ${options}
                </select>
            `;
        }

        function getCurrentStudent() {
            return appData.students.find(s => s.id === currentStudentId);
        }

        function renderApp() {
            const student = getCurrentStudent();
            if (!student) {
                showNameSelector();
                return;
            }

            document.getElementById('display-grade').innerText = student.grade || '1ねんせい';
            document.getElementById('current-student-name').innerHTML = `${escapeHtml(student.name)} <i class="fa-solid fa-caret-down text-sm text-teal-300"></i>`;
            
            // 花丸＆レベルバッジの更新
            const stamps = student.hanamaruCount || 0;
            const lvlInfo = getLevelInfo(stamps);
            document.getElementById('header-stamp-count').innerText = `${stamps}こ`;
            document.getElementById('header-level-badge').innerText = `Lv.${lvlInfo.level}`;

            const container = document.getElementById('app-container');
            let html = '';
            
            student.hours.forEach((hour, hIdx) => {
                const allCompleted = hour.tasks.length > 0 && hour.tasks.every(t => t.completed);
                
                html += `
                    <div class="mb-8 fade-in" style="animation-delay: ${hIdx * 0.1}s">
                        <div class="flex items-center gap-3 mb-3">
                            <h2 class="text-xl md:text-2xl font-black text-slate-700 bg-white px-4 py-1.5 rounded-full shadow-sm inline-flex items-center gap-2 border-2 ${allCompleted ? 'border-emerald-400 text-emerald-600' : 'border-slate-200'}">
                                <i class="fa-regular fa-clock text-slate-400"></i>
                                ${escapeHtml(hour.time)}
                                ${hour.subject ? getSubjectBadgeHtml(hour.subject) : ''}
                            </h2>
                            ${allCompleted ? '<span class="text-emerald-500 font-bold text-sm bg-emerald-100 px-2.5 py-1 rounded-lg animate-bounce">くりあ！🌟</span>' : ''}
                        </div>
                        <div class="space-y-3 pl-2 md:pl-6">
                `;

                if (hour.tasks.length === 0) {
                    html += `<div class="text-slate-400 text-sm font-bold bg-white/50 p-4 rounded-2xl border border-dashed border-slate-200">このじかんは おやすみです☕</div>`;
                }

                hour.tasks.forEach((item, itemIdx) => {
                    html += `
                        <div class="task-card bg-white rounded-2xl p-3 md:p-4 shadow-sm border-2 ${item.completed ? 'border-emerald-400 bg-emerald-50/30' : 'border-transparent'} flex items-center justify-between gap-4 cursor-pointer" onclick="toggleTask(${hIdx}, ${itemIdx})">
                            <div class="flex items-center gap-3 md:gap-4 flex-1 min-w-0">
                                <div class="w-12 h-12 md:w-14 md:h-14 shrink-0 rounded-xl flex items-center justify-center text-2xl md:text-3xl transition-colors ${item.completed ? 'bg-emerald-100 text-emerald-500' : 'bg-orange-50 text-orange-400'}">
                                    <i class="fa-solid ${item.completed ? 'fa-check' : 'fa-pen-to-square'}"></i>
                                </div>
                                <span class="font-bold text-base md:text-lg ${item.completed ? 'line-through text-slate-400' : 'text-slate-700'}">
                                    ${escapeHtml(item.text)}
                                </span>
                            </div>
                            <button class="px-4 py-2 rounded-xl font-black text-sm shrink-0 transition-all shadow bounce-active flex items-center space-x-1.5 ${
                                item.completed 
                                    ? 'bg-emerald-500 text-white hover:bg-emerald-600' 
                                    : 'bg-gradient-to-r from-amber-400 to-orange-400 text-white hover:from-amber-500 hover:to-orange-500'
                            }">
                                <i class="fa-solid ${item.completed ? 'fa-circle-check' : 'fa-circle-dot'}"></i>
                                <span>できた！</span>
                            </button>
                        </div>
                    `;
                });
                
                html += `</div></div>`;
            });

            container.innerHTML = html;
            checkAllCompleted();
        }

        function toggleTask(hIdx, itemIdx) {
            const student = getCurrentStudent();
            if (!student) return;

            const task = student.hours[hIdx].tasks[itemIdx];
            task.completed = !task.completed;
            
            saveDataToLocal();
            renderApp();

            if (task.completed) {
                playSound('check');
                confetti({ particleCount: 30, spread: 50, origin: { y: 0.8 }, colors: ['#34d399', '#fbbf24', '#60a5fa'] });
            }
        }

        // 花丸オーバーレイを確実に非表示にする関数
        function hideHanamaruOverlay() {
            const overlay = document.getElementById('hanamaru-overlay');
            if (overlay) overlay.classList.add('hidden');
        }

        function checkAllCompleted() {
            const student = getCurrentStudent();
            if (!student) return;

            const allTasks = student.hours.flatMap(h => h.tasks);
            if (allTasks.length > 0 && allTasks.every(t => t.completed)) {
                // 本日すでにスタンプ獲得済みか確認
                const todayKey = 'hanamaru_earned_' + new Date().toISOString().slice(0, 10) + '_' + student.id;
                const alreadyEarned = localStorage.getItem(todayKey);

                if (!alreadyEarned) {
                    localStorage.setItem(todayKey, 'true');
                    student.hanamaruCount = (student.hanamaruCount || 0) + 1;
                    saveDataToLocal();
                }

                setTimeout(() => {
                    playSound('clear');
                    
                    const overlay = document.getElementById('hanamaru-overlay');
                    if (overlay) overlay.classList.remove('hidden');

                    const count = 200;
                    const defaults = { origin: { y: 0.7 } };

                    function fire(particleRatio, opts) {
                        confetti({
                            ...defaults,
                            ...opts,
                            particleCount: Math.floor(count * particleRatio)
                        });
                    }

                    fire(0.25, { spread: 26, startVelocity: 55, colors: ['#ef4444', '#fbbf24'] });
                    fire(0.2, { spread: 60, colors: ['#34d399', '#60a5fa'] });
                    fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
                    fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, colors: ['#a78bfa', '#f472b6'] });
                    fire(0.1, { spread: 120, startVelocity: 45 });
                    
                    // 花丸アニメーション表示後、ダイアログを出す前にオーバーレイを閉じて確実に抜け出せるようにする
                    setTimeout(() => {
                        hideHanamaruOverlay();
                        const stamps = student.hanamaruCount;
                        const lvlInfo = getLevelInfo(stamps);

                        Swal.fire({
                            title: '100てん まんてん！💮',
                            html: `
                                <p class="text-slate-600 font-bold mb-3">きょうの やることを すべてクリアしたよ！</p>
                                <div class="bg-rose-50 border-2 border-rose-200 rounded-2xl p-3 inline-block text-rose-700 font-black text-lg">
                                    💮 はなまるすたんぷ 1こ げっと！<br>
                                    <span class="text-sm font-bold text-slate-500">（ぜんぶで ${stamps}こ / ${lvlInfo.name}）</span>
                                </div>
                            `,
                            imageUrl: 'https://cdn-icons-png.flaticon.com/512/3176/3176294.png',
                            imageWidth: 90,
                            showCancelButton: true,
                            cancelButtonText: 'とじる',
                            confirmButtonText: 'スタンプちょうをみる！',
                            confirmButtonColor: '#ef4444',
                            cancelButtonColor: '#94a3b8'
                        }).then((result) => {
                            hideHanamaruOverlay();
                            if (result.isConfirmed) {
                                openStampModal();
                            }
                        });
                    }, 1800);
                }, 300);
            }
        }

        function openStampModal() {
            hideHanamaruOverlay();
            const student = getCurrentStudent();
            if (!student) return;

            const stamps = student.hanamaruCount || 0;
            const lvlInfo = getLevelInfo(stamps);

            document.getElementById('stamp-modal-student-name').innerText = student.name;
            document.getElementById('stamp-level-title').innerText = `Lv.${lvlInfo.level} ${lvlInfo.name}`;
            document.getElementById('stamp-total-text').innerText = `${stamps} / 20こ`;

            // プログレスバー計算
            let percent = 100;
            if (lvlInfo.next !== 999) {
                percent = Math.min(100, Math.round((stamps / lvlInfo.next) * 100));
                document.getElementById('stamp-next-info').innerText = `つぎのレベルまで あと ${lvlInfo.next - stamps}こ💮`;
            } else {
                document.getElementById('stamp-next-info').innerText = `さいこうレベル たっせい！すばらしい！👑`;
            }
            document.getElementById('stamp-level-bar').style.width = percent + '%';

            // スタンプグリッド (20マス生成)
            const grid = document.getElementById('stamp-grid');
            let gridHtml = '';
            for (let i = 1; i <= 20; i++) {
                const hasStamp = i <= stamps;
                gridHtml += `
                    <div class="aspect-square bg-white rounded-xl border-2 ${hasStamp ? 'border-rose-400 bg-rose-50' : 'border-dashed border-amber-200'} flex items-center justify-center relative shadow-sm">
                        <span class="absolute top-1 left-1 text-[10px] font-bold text-amber-300">${i}</span>
                        ${hasStamp ? '<span class="text-2xl md:text-3xl animate-bounce">💮</span>' : ''}
                    </div>
                `;
            }
            grid.innerHTML = gridHtml;

            document.getElementById('stamp-modal').classList.remove('hidden');
        }

        function closeStampModal() {
            document.getElementById('stamp-modal').classList.add('hidden');
            renderApp();
        }

        function openEditModal() {
            hideHanamaruOverlay();
            if (!editingStudentId && appData.students.length > 0) {
                editingStudentId = appData.students[0].id;
            }
            renderEditModalSidebar();
            
            const gradeSelect = document.getElementById('edit-grade');
            gradeSelect.innerHTML = GRADES.map(g => `<option value="${g}" ${appData.grade === g ? 'selected' : ''}>${g}</option>`).join('');

            document.getElementById('edit-modal').classList.remove('hidden');
            document.getElementById('name-selector-modal').classList.add('hidden');
        }

        function renderEditModalSidebar() {
            const container = document.getElementById('edit-student-list');
            let html = `
                <button onclick="addNewStudent()" class="w-full py-2 px-3 border-2 border-dashed border-teal-300 text-teal-600 font-bold rounded-xl hover:bg-teal-50 transition-colors flex items-center justify-center gap-2 mb-3 text-sm shadow-sm">
                    <i class="fa-solid fa-plus"></i> なまえをついか
                </button>
            `;

            appData.students.forEach(student => {
                const isSelected = student.id === editingStudentId;
                html += `
                    <div class="flex items-center gap-1 mb-1 border-b border-slate-200/50 pb-1">
                        <button onclick="selectEditStudent('${student.id}')" class="flex-1 text-left px-3 py-2 rounded-lg font-bold text-sm transition-colors truncate ${isSelected ? 'bg-teal-500 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-slate-200'}">
                            ${escapeHtml(student.name)}
                        </button>
                        <button onclick="deleteStudent('${student.id}')" class="w-8 h-8 flex items-center justify-center text-red-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors shrink-0" title="さくじょ">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
            });
            container.innerHTML = html;
            renderEditForm();
        }

        function addNewStudent() {
            saveCurrentEditForm();
            const newId = 'student-' + Date.now();
            let newHours = JSON.parse(JSON.stringify(defaultHours1st));

            appData.students.push({ id: newId, name: 'あたらしい なまえ', grade: '1ねんせい', hanamaruCount: 0, hours: newHours });
            editingStudentId = newId;
            renderEditModalSidebar();
        }

        function deleteStudent(studentId) {
            Swal.fire({
                title: 'ほんとうに けす？',
                text: "このひとの データを けします",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonText: 'やめる',
                confirmButtonText: 'けす'
            }).then((result) => {
                if (result.isConfirmed) {
                    appData.students = appData.students.filter(s => s.id !== studentId);
                    if (editingStudentId === studentId) {
                        editingStudentId = appData.students.length > 0 ? appData.students[0].id : null;
                    }
                    if (currentStudentId === studentId) {
                        currentStudentId = null;
                    }
                    renderEditModalSidebar();
                }
            });
        }

        function selectEditStudent(studentId) {
            saveCurrentEditForm();
            editingStudentId = studentId;
            renderEditModalSidebar();
        }

        function saveCurrentEditForm() {
            if (!editingStudentId) return;
            const student = appData.students.find(s => s.id === editingStudentId);
            if (!student) return;

            const nameInput = document.getElementById('edit-student-name-input');
            const gradeSelect = document.getElementById('edit-student-grade-select');
            if (nameInput) student.name = nameInput.value.trim() || 'ななし';
            if (gradeSelect) student.grade = gradeSelect.value;

            for (let hIdx = 0; hIdx < 5; hIdx++) {
                const timeInput = document.getElementById(`edit-time-${hIdx}`);
                const subjectSelect = document.getElementById(`edit-hour-subject-${hIdx}`);
                if (timeInput && subjectSelect) {
                    student.hours[hIdx].time = timeInput.value;
                    student.hours[hIdx].subject = subjectSelect.value;
                    
                    const newTasks = [];
                    for (let i = 0; i < 4; i++) {
                        const textInput = document.getElementById(`edit-task-text-${hIdx}-${i}`);
                        if (textInput) {
                            const text = textInput.value.trim();
                            if (text !== '') {
                                const oldTask = student.hours[hIdx].tasks[i];
                                newTasks.push({ text: text, completed: oldTask ? oldTask.completed : false });
                            }
                        }
                    }
                    student.hours[hIdx].tasks = newTasks;
                }
            }

            syncSameGradeStudents(student);
        }

        function syncSameGradeStudents(sourceStudent) {
            appData.students.forEach(target => {
                if (target.id !== sourceStudent.id && target.grade === sourceStudent.grade) {
                    target.hours = sourceStudent.hours.map(h => ({
                        time: h.time,
                        subject: h.subject,
                        tasks: h.tasks.map(t => ({
                            text: t.text,
                            completed: false
                        }))
                    }));
                }
            });
        }

        function renderEditForm() {
            const container = document.getElementById('edit-form-container');
            const student = appData.students.find(s => s.id === editingStudentId);
            
            if (!student) {
                container.innerHTML = '<div class="flex items-center justify-center h-full text-slate-400 font-bold p-4 text-center">左のリストから<br>なまえを選んでください</div>';
                return;
            }

            let html = `
                <div class="mb-3 bg-white p-4 rounded-xl border border-slate-200 sticky top-0 z-10 shadow-sm flex flex-col md:flex-row md:items-center gap-3">
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-slate-500 mb-1">このひとの なまえ</label>
                        <input type="text" id="edit-student-name-input" value="${escapeHtml(student.name)}" class="w-full border rounded-lg p-2 font-black text-xl text-teal-700 outline-none focus:ring-2 focus:ring-teal-500 bg-teal-50">
                    </div>
                    <div class="w-full md:w-36">
                        <label class="block text-xs font-bold text-slate-500 mb-1">がくねん</label>
                        <select id="edit-student-grade-select" class="w-full border rounded-lg p-2 font-bold text-slate-700 outline-none focus:ring-2 focus:ring-teal-500 bg-white text-sm">
                            ${GRADES.map(g => `<option value="${g}" ${(student.grade || '1ねんせい') === g ? 'selected' : ''}>${g}</option>`).join('')}
                        </select>
                    </div>
                </div>
                <div class="mb-4 px-3 py-2 bg-teal-50 border border-teal-200 text-teal-800 rounded-xl text-xs font-bold flex items-center gap-2">
                    <i class="fa-solid fa-arrows-rotate text-teal-600 text-sm"></i>
                    <span>同じ「${escapeHtml(student.grade)}」のお友達にも自動同期されます！</span>
                </div>
            `;

            student.hours.forEach((hour, hIdx) => {
                html += `
                    <div class="mb-6 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                        <div class="flex items-center gap-2 mb-3">
                            <input type="text" id="edit-time-${hIdx}" value="${escapeHtml(hour.time)}" class="font-bold bg-slate-100 border-none rounded px-2 py-1 w-28 md:w-32 focus:ring-2 focus:ring-teal-500 outline-none text-sm md:text-base">
                            ${getSubjectSelectHtml(hour.subject, `edit-hour-subject-${hIdx}`)}
                        </div>
                        <div id="edit-tasks-${hIdx}" class="space-y-2 pl-2 border-l-2 border-slate-100">
                `;

                for (let i = 0; i < 4; i++) {
                    const task = hour.tasks[i] || { text: '' };
                    html += `
                        <div class="flex items-center gap-2 bg-slate-50 p-2 rounded">
                            <span class="text-xs font-bold text-slate-400 w-4">${i+1}.</span>
                            <input type="text" 
                                id="edit-task-text-${hIdx}-${i}" 
                                data-hidx="${hIdx}" 
                                data-tidx="${i}"
                                value="${escapeHtml(task.text)}" 
                                placeholder="やること（空欄で非表示）" 
                                onkeydown="handleTaskInputKeydown(event, ${hIdx}, ${i})"
                                class="task-input-field flex-1 border rounded p-1 text-sm focus:ring-2 focus:ring-teal-500 outline-none">
                        </div>
                    `;
                }

                html += `</div></div>`;
            });

            container.innerHTML = html;
        }

        // キーボード操作（Enter, ↓, ↑）で入力欄を上下移動する関数
        function handleTaskInputKeydown(e, hIdx, tIdx) {
            if (e.key === 'Enter' || e.key === 'ArrowDown') {
                e.preventDefault();
                let nextH = hIdx;
                let nextT = tIdx + 1;
                if (nextT >= 4) {
                    nextH = hIdx + 1;
                    nextT = 0;
                }
                const nextInput = document.getElementById(`edit-task-text-${nextH}-${nextT}`);
                if (nextInput) {
                    nextInput.focus();
                    nextInput.select();
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                let prevH = hIdx;
                let prevT = tIdx - 1;
                if (prevT < 0) {
                    prevH = hIdx - 1;
                    prevT = 3;
                }
                const prevInput = document.getElementById(`edit-task-text-${prevH}-${prevT}`);
                if (prevInput) {
                    prevInput.focus();
                    prevInput.select();
                }
            }
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
            checkAndShowNameSelector();
        }

        function saveChanges() {
            saveCurrentEditForm();
            appData.grade = document.getElementById('edit-grade').value;
            // 編集保存時、新しい日の課題として全員のチェックを自動リセット
            resetAllTasksCompletion();
            saveDataToLocal();
            closeEditModal();
            if (currentStudentId) renderApp();
            
            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: '保存しました！', showConfirmButton: false, timer: 1500 });
        }

        function generateShareData() {
            const shareData = JSON.parse(JSON.stringify(appData));
            shareData.students.forEach(student => {
                student.hours.forEach(hour => {
                    hour.tasks.forEach(task => task.completed = false);
                });
            });

            const jsonStr = JSON.stringify(shareData);
            const base64Str = btoa(unescape(encodeURIComponent(jsonStr)));
            return `${window.location.origin}${window.location.pathname}?data=${base64Str}`;
        }

        function copyShareUrl() {
            const url = generateShareData();
            navigator.clipboard.writeText(url).then(() => {
                Swal.fire({ icon: 'success', title: 'URLをコピーしました！', text: 'メールやチャットで送れます。', confirmButtonColor: '#14b8a6' });
            }).catch(err => {
                const textArea = document.createElement("textarea");
                textArea.value = url;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    Swal.fire('コピー成功', 'URLをコピーしました！', 'success');
                } catch (err) {
                    Swal.fire('エラー', 'コピーできませんでした。', 'error');
                }
                document.body.removeChild(textArea);
            });
        }

        function shareClassroom() {
            const url = generateShareData();
            const classroomUrl = `https://classroom.google.com/share?url=${encodeURIComponent(url)}&title=${encodeURIComponent('きょうの やることリスト')}`;
            window.open(classroomUrl, '_blank', 'width=800,height=600');
        }

        window.onload = init;
    </script>
</body>
</html>
